# Ambiente de desenvolvimento — MySQL 8.2
#
# ATENÇÃO:
#   * Credenciais fixas (root / root): use APENAS em desenvolvimento.
#   * Sem persistência: /var/lib/mysql fica em tmpfs (memória). Todos os
#     dados somem quando o container para.
#
# Uso recomendado: ./scripts/db.sh help  (ver docs/TUTORIAL_DOCKER.md)

name: captacao

services:
  mysql:
    image: mysql:8.2
    container_name: captacao_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root   # apenas desenvolvimento
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    tmpfs:
      - /var/lib/mysql            # sem persistência
    volumes:
      - ./sql:/sql:ro             # scripts SQL acessíveis dentro do container
    healthcheck:
      # TCP (-h 127.0.0.1) de propósito: o servidor temporário da
      # inicialização roda sem rede, então só o servidor definitivo responde.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
